
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spotify OAuth Callback</title>

  <style>
    :root {
      color-scheme: dark;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    body {
      max-width: 760px;
      margin: 60px auto;
      padding: 0 20px;
      color: #e8e8e8;
      background: #090909;
    }

    .panel {
      padding: 24px;
      border: 1px solid #333;
      border-radius: 12px;
      background: #111;
    }

    input,
    button,
    textarea {
      box-sizing: border-box;
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      color: #fff;
      border: 1px solid #444;
      border-radius: 7px;
      background: #181818;
      font: inherit;
    }

    button {
      color: #000;
      border: 0;
      background: #1db954;
      font-weight: 700;
      cursor: pointer;
    }

    textarea {
      min-height: 150px;
      resize: vertical;
    }

    code {
      overflow-wrap: anywhere;
      color: #1ed760;
    }

    .hidden {
      display: none;
    }

    .error {
      color: #ff7070;
    }

    .success {
      color: #1ed760;
    }

    small {
      color: #aaa;
    }
  </style>
</head>

<body>
  <main class="panel">
    <h1>Spotify OAuth</h1>

    <p>
      Redirect URI:
      <br>
      <code id="redirect-uri"></code>
    </p>

    <section id="login-section">
      <label for="client-id">Spotify Client ID</label>
      <input
        id="client-id"
        type="text"
        autocomplete="off"
        placeholder="Paste your Spotify Client ID"
      >

      <button id="authorize-button" type="button">
        Authorize with Spotify
      </button>

      <p>
        <small>
          The Client ID is not secret. Never enter your Client Secret on this page.
        </small>
      </p>
    </section>

    <section id="result-section" class="hidden">
      <h2 class="success">Authorization completed</h2>

      <label for="refresh-token">SPOTIFY_REFRESH_TOKEN</label>
      <textarea id="refresh-token" readonly></textarea>

      <button id="copy-button" type="button">
        Copy refresh token
      </button>

      <p>
        Save this value in GitHub under
        <code>SPOTIFY_REFRESH_TOKEN</code>.
      </p>
    </section>

    <p id="status"></p>
  </main>

  <script>
    const SCOPES = [
      "user-read-playback-state",
      "user-read-currently-playing",
      "user-read-recently-played"
    ];

    const redirectUri =
      window.location.origin + window.location.pathname;

    const redirectElement = document.getElementById("redirect-uri");
    const clientIdElement = document.getElementById("client-id");
    const authorizeButton = document.getElementById("authorize-button");
    const copyButton = document.getElementById("copy-button");
    const refreshTokenElement = document.getElementById("refresh-token");
    const loginSection = document.getElementById("login-section");
    const resultSection = document.getElementById("result-section");
    const statusElement = document.getElementById("status");

    redirectElement.textContent = redirectUri;

    function randomString(length = 64) {
      const characters =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~";

      const randomValues = new Uint8Array(length);
      crypto.getRandomValues(randomValues);

      return Array.from(
        randomValues,
        value => characters[value % characters.length]
      ).join("");
    }

    function base64UrlEncode(buffer) {
      const bytes = new Uint8Array(buffer);
      let binary = "";

      for (const byte of bytes) {
        binary += String.fromCharCode(byte);
      }

      return btoa(binary)
        .replace(/\+/g, "-")
        .replace(/\//g, "_")
        .replace(/=+$/, "");
    }

    async function createCodeChallenge(verifier) {
      const encoded = new TextEncoder().encode(verifier);
      const digest = await crypto.subtle.digest("SHA-256", encoded);
      return base64UrlEncode(digest);
    }

    async function beginAuthorization() {
      const clientId = clientIdElement.value.trim();

      if (!clientId) {
        statusElement.className = "error";
        statusElement.textContent = "Spotify Client ID is required.";
        return;
      }

      const verifier = randomString(96);
      const challenge = await createCodeChallenge(verifier);
      const state = randomString(40);

      sessionStorage.setItem("spotify_client_id", clientId);
      sessionStorage.setItem("spotify_code_verifier", verifier);
      sessionStorage.setItem("spotify_oauth_state", state);

      const parameters = new URLSearchParams({
        client_id: clientId,
        response_type: "code",
        redirect_uri: redirectUri,
        scope: SCOPES.join(" "),
        code_challenge_method: "S256",
        code_challenge: challenge,
        state,
        show_dialog: "true"
      });

      window.location.href =
        "https://accounts.spotify.com/authorize?" +
        parameters.toString();
    }

    async function exchangeAuthorizationCode() {
      const parameters = new URLSearchParams(window.location.search);
      const code = parameters.get("code");
      const returnedState = parameters.get("state");
      const spotifyError = parameters.get("error");

      if (spotifyError) {
        throw new Error("Spotify authorization failed: " + spotifyError);
      }

      if (!code) {
        return;
      }

      const clientId = sessionStorage.getItem("spotify_client_id");
      const verifier = sessionStorage.getItem("spotify_code_verifier");
      const expectedState = sessionStorage.getItem("spotify_oauth_state");

      if (!clientId || !verifier || !expectedState) {
        throw new Error(
          "OAuth session data is missing. Start authorization again."
        );
      }

      if (returnedState !== expectedState) {
        throw new Error("OAuth state validation failed.");
      }

      statusElement.textContent =
        "Exchanging authorization code with Spotify…";

      const response = await fetch(
        "https://accounts.spotify.com/api/token",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/x-www-form-urlencoded"
          },
          body: new URLSearchParams({
            client_id: clientId,
            grant_type: "authorization_code",
            code,
            redirect_uri: redirectUri,
            code_verifier: verifier
          })
        }
      );

      const payload = await response.json();

      if (!response.ok) {
        throw new Error(
          payload.error_description ||
          payload.error ||
          "Spotify token exchange failed."
        );
      }

      if (!payload.refresh_token) {
        throw new Error(
          "Spotify did not return a refresh token."
        );
      }

      refreshTokenElement.value = payload.refresh_token;
      loginSection.classList.add("hidden");
      resultSection.classList.remove("hidden");

      statusElement.className = "success";
      statusElement.textContent =
        "Refresh token generated successfully.";

      sessionStorage.removeItem("spotify_code_verifier");
      sessionStorage.removeItem("spotify_oauth_state");

      window.history.replaceState(
        {},
        document.title,
        window.location.pathname
      );
    }

    authorizeButton.addEventListener(
      "click",
      () => beginAuthorization().catch(showError)
    );

    copyButton.addEventListener("click", async () => {
      await navigator.clipboard.writeText(
        refreshTokenElement.value
      );

      copyButton.textContent = "Copied";
    });

    function showError(error) {
      statusElement.className = "error";
      statusElement.textContent = error.message;
    }

    exchangeAuthorizationCode().catch(showError);
  </script>
</body>
</html>
